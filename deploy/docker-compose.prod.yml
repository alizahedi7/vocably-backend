# Production stack for the VPS. Lives at /opt/vocably on the server together
# with a .env file (see .env.example) — the CD workflow copies this file and
# the Caddyfile there on every deploy, then runs `docker compose pull && up -d`.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vocably}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-vocably}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vocably} -d ${POSTGRES_DB:-vocably}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # No `ports:` on purpose — the broker is reachable only from inside this
    # compose network. Publishing 6379 would expose an unauthenticated Redis
    # to the internet, which is among the most reliably exploited misconfigs
    # there is.
    #
    # Unlike the dev stack, persistence is ON here: the broker holds queued
    # work, and a restart with persistence off silently drops whatever was
    # in flight. Beat would re-emit the maintenance job, but future AI tasks
    # will represent real money and must survive a container bounce.
    command: redis-server --appendonly yes --appendfsync everysec
    mem_limit: 96m
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: ghcr.io/alizahedi7/vocably-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Everything else (SECRET_KEY, Kavenegar, Google, …) comes from .env;
    # the values below are fixed by the shape of this stack and win over .env.
    env_file: .env
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vocably}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-vocably}
      CELERY_BROKER_URL: redis://redis:6379/0
      # Same Redis, separate logical databases. Both default to
      # localhost, which inside this network is the container itself —
      # so they MUST be set here or they silently degrade: the
      # dictionary cache to no cache, and the rate limits from global
      # to per-worker, which is the wrong primitive for the two of them
      # that are security controls (handle enumeration, invite guessing).
      DICTIONARY_REDIS_URL: redis://redis:6379/1
      RATE_LIMIT_REDIS_URL: redis://redis:6379/2
      # The single-flight lock for lexicon generation. Its own database, and
      # unset it would default to localhost — i.e. the container itself, where
      # nothing is listening — so concurrent builds would each buy the same
      # word. Not a correctness problem (unique constraints handle that), but
      # it is money.
      LEXICON_REDIS_URL: redis://redis:6379/3
    # This is the only service that migrates; worker and beat deliberately do
    # not, so a deploy never runs two migration attempts concurrently.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  # Executes background tasks. Safe to scale to more replicas.
  worker:
    image: ghcr.io/alizahedi7/vocably-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vocably}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-vocably}
      CELERY_BROKER_URL: redis://redis:6379/0
      # Same Redis, separate logical databases. Both default to
      # localhost, which inside this network is the container itself —
      # so they MUST be set here or they silently degrade: the
      # dictionary cache to no cache, and the rate limits from global
      # to per-worker, which is the wrong primitive for the two of them
      # that are security controls (handle enumeration, invite guessing).
      DICTIONARY_REDIS_URL: redis://redis:6379/1
      RATE_LIMIT_REDIS_URL: redis://redis:6379/2
      # The single-flight lock for lexicon generation. Its own database, and
      # unset it would default to localhost — i.e. the container itself, where
      # nothing is listening — so concurrent builds would each buy the same
      # word. Not a correctness problem (unique constraints handle that), but
      # it is money.
      LEXICON_REDIS_URL: redis://redis:6379/3
    # Memory, not CPU, is the binding constraint on this VPS: a single process
    # running this app measures ~110 MiB, against under 1 GiB of RAM shared
    # with Postgres, Caddy, the API and the admin dashboard. Prefork spawns
    # `concurrency` children *on top of* the parent, so --concurrency=1 means
    # two processes, and each extra one costs another ~110 MiB. Raise it only
    # alongside an actual measurement of what is free.
    #
    # --max-tasks-per-child recycles the child periodically, bounding the blast
    # radius of a slow leak in any long-lived task.
    command: >
      celery -A app.tasks worker --loglevel=info
      -Q default,maintenance,ai
      --concurrency=1 --max-tasks-per-child=100
    # A hard ceiling so a runaway task is killed by Docker (and restarted)
    # rather than by the kernel's OOM killer, which would be free to pick
    # Postgres or the API instead — turning a task bug into an outage.
    #
    # The three caps here (96 + 256 + 128 MiB) are deliberately sized so that
    # even all three services at their ceiling, on top of the ~240 MiB the
    # existing stack uses, stays clear of this box's 957 MiB with room for the
    # OS and Postgres' page cache. This VPS has no swap, so "worst case still
    # fits" has to be true by construction rather than by luck.
    mem_limit: 256m

  # Emits scheduled tasks. MUST stay at exactly one replica: beat is a clock,
  # and a second one makes every scheduled task fire twice.
  beat:
    image: ghcr.io/alizahedi7/vocably-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vocably}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-vocably}
      CELERY_BROKER_URL: redis://redis:6379/0
      # Same Redis, separate logical databases. Both default to
      # localhost, which inside this network is the container itself —
      # so they MUST be set here or they silently degrade: the
      # dictionary cache to no cache, and the rate limits from global
      # to per-worker, which is the wrong primitive for the two of them
      # that are security controls (handle enumeration, invite guessing).
      DICTIONARY_REDIS_URL: redis://redis:6379/1
      RATE_LIMIT_REDIS_URL: redis://redis:6379/2
      # The single-flight lock for lexicon generation. Its own database, and
      # unset it would default to localhost — i.e. the container itself, where
      # nothing is listening — so concurrent builds would each buy the same
      # word. Not a correctness problem (unique constraints handle that), but
      # it is money.
      LEXICON_REDIS_URL: redis://redis:6379/3
    # /tmp because the image runs as a non-root user that cannot write to the
    # working directory. Losing this file only re-evaluates the schedule.
    command: celery -A app.tasks beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    # Beat only emits messages on a timer; it never runs task bodies.
    mem_limit: 128m

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    # `default` for db/api (as before); `vocably-net` is a shared external
    # network joining this container with the admin dashboard's — a
    # separate compose project (vocably-admin) on this same VPS. Create it
    # once with `docker network create vocably-net` before the first deploy
    # that includes ADMIN_DOMAIN.
    networks:
      - default
      - vocably-net
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      WEB_DOMAIN: ${WEB_DOMAIN:?set WEB_DOMAIN in .env}
      # Not required like the two above: the Caddyfile falls back to a
      # never-resolvable placeholder when unset, so a VPS not yet set up for
      # the admin dashboard still starts cleanly. Set this once the DNS
      # record and the vocably-admin container both exist.
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The PWA (vocably-mobile), published as static files by that repo's
      # own workflow. Caddy serves them as a second site; this container is
      # the only thing on the host holding ports 80/443.
      - /opt/vocably/web:/srv/vocably-web:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:

networks:
  vocably-net:
    external: true
