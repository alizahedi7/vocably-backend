# The ordered headword list. Order is the product: this is the sequence the
# course teaches, and nothing in the pipeline may reorder it.
#
# PROVENANCE, stated plainly because it differs from the 504 deck's: this list
# was **compiled by Vocably**, not extracted from a printed index. It teaches the
# vocabulary tier of the source named in deck.yaml and is grouped into 46 weekly
# units to approximate that book's progression, but the week a given word falls
# in is our editorial judgement and does not reproduce the source's printed
# sequence. Nothing here is copied from the book.
#
# Words run from the more widely used advanced vocabulary toward the rarer, and
# each week is built around a shared sense so that a learner meets a family of
# words together rather than twenty-four unrelated ones.
#
# A bare string is a word with no sense preference - the ordinary case.
# A mapping may add:
#   sense: {pos: verb, context: Management}   # an exact pin; needs BOTH keys
#   hint: "to give up completely"             # free text, scored against senses
#
# There is deliberately nowhere to put a definition or an example. Those are
# generated; copying them from a source is the one thing this format forbids.

