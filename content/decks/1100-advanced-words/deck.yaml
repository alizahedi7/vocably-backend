slug: 1100-advanced-words
version: "1.0.0"
name: 1100 Advanced Words
name_fa: ۱۱۰۰ واژه پیشرفته
category: exam
# One line, and it must stay one line: the Explore card is a fixed height, so
# a longer description is silently truncated rather than given more room.
description: Advanced vocabulary, a week of words at a time.
description_fa: واژگان پیشرفته، هر هفته یک دسته.
official: true
# Amber, so the card is told apart from the 504 deck's violet at a glance.
hue: 28
# Drawn in place of the deck's initial by clients that ship the asset. A client
# that has no "1100" logo yet draws the initial instead, which is not an error.
icon: "1100"

source:
  title: 1100 Words You Need to Know
  authors: [Bromberg, Gordon]
  # No ISBN and no edition: this list was not transcribed from a particular
  # printing, so naming one would claim a fidelity it does not have.
  rights: >-
    Inspiration and vocabulary tier only. Unlike the 504 deck, this word list was
    compiled by Vocably rather than extracted from the source's index: the
    headwords are our selection, and the week a word falls in is our editorial
    grouping, not the book's printed sequence. No definitions, example sentences,
    reading passages, exercises or explanatory text from the source are
    reproduced anywhere in this repository or on any card. Every word of card
    content is generated by Vocably's own pipeline or taken from a free
    dictionary. The deck is named for the word count it teaches rather than
    carrying the book's full title, so it does not read as an official edition.

structure:
  # Asserted, not derived: a word list that silently loses an entry is otherwise
  # invisible until a learner notices a week is short.
  #
  # `words_per_unit` is deliberately absent — the weeks are not uniform (weeks
  # 1-42 hold 24, weeks 43-46 hold 23, summing to 1100), and the loader fails a
  # template whose declared per-unit count disagrees with any unit.
  # `expected_words` still catches a dropped entry, which is what it is for.
  expected_units: 46
  expected_words: 1100

generation:
  native_language: Persian
  register: adult
  # The full ladder. Most words here need no pin — a course teaches the common
  # sense of a word — so `first` carries the bulk of the deck, and those picks
  # are exactly what the admin review queue surfaces. The hints in words.yaml
  # cover the headwords whose commonest sense is *not* the one being taught.
  sense_selection: [explicit, hint, category, first]
  enrichment: allowed
  max_senses: 4

publication:
  # Never automatic. A build finishing is not a reason for eleven hundred
  # unreviewed cards to appear in Explore.
  review_required: true
  publish: manual
