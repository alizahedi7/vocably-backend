# The ordered word list. Order is the product: nothing in the pipeline may
# reorder it. Compiled by Vocably; nothing here is copied from any source.
#
# Five pairs per unit, each pair adjacent. Every entry carries a hint, because
# the point of the deck is the difference between the two.
#
# There is deliberately nowhere to put a definition or an example. Those are
# generated; copying them from a source is the one thing this format forbids.

units:
  - name: "Unit 1"
    words:
      - term: "affect"
        hint: "to change or influence something (verb)"
      - term: "effect"
        hint: "a result or change caused by something (noun)"
      - term: "accept"
        hint: "to agree to take something offered"
      - term: "except"
        hint: "not including"
      - term: "advice"
        hint: "an opinion about what someone should do (noun)"
      - term: "advise"
        hint: "to tell someone what you think they should do (verb)"
      - term: "borrow"
        hint: "to take something that you will give back"
      - term: "lend"
        hint: "to give something that will be given back to you"
      - term: "lose"
        hint: "to no longer have something, or to not win"
      - term: "loose"
        hint: "not tight or not firmly fixed"

  - name: "Unit 2"
    words:
      - term: "quite"
        hint: "fairly, to some degree"
      - term: "quiet"
        hint: "making little or no noise"
      - term: "then"
        hint: "next, or at that time"
      - term: "than"
        hint: "used to compare two things"
      - term: "alone"
        hint: "without other people"
      - term: "lonely"
        hint: "sad because you have no company"
      - term: "bring"
        hint: "to carry something to the place where you are"
      - term: "take"
        hint: "to carry something away to another place"
      - term: "say"
        hint: "to speak words; used without a listener as object"
      - term: "tell"
        hint: "to give information to someone; used with a person"

  - name: "Unit 3"
    words:
      - term: "rise"
        hint: "to go up by itself (no object)"
      - term: "raise"
        hint: "to lift or increase something (with an object)"
      - term: "lie"
        hint: "to be in a flat position, resting"
      - term: "lay"
        hint: "to put something down carefully"
      - term: "sensible"
        hint: "showing good judgement"
      - term: "sensitive"
        hint: "easily upset, or quick to notice feelings"
      - term: "economic"
        hint: "relating to the economy"
      - term: "economical"
        hint: "using little money or fuel"
      - term: "historic"
        hint: "important in history"
      - term: "historical"
        hint: "relating to the past or to history"

  - name: "Unit 4"
    words:
      - term: "principal"
        hint: "the head of a school, or most important"
      - term: "principle"
        hint: "a basic rule or belief"
      - term: "stationary"
        hint: "not moving"
      - term: "stationery"
        hint: "paper, pens and office supplies"
      - term: "complement"
        hint: "something that goes well with something else"
      - term: "compliment"
        hint: "a nice thing you say about someone"
      - term: "desert"
        hint: "a large dry area of sand"
      - term: "dessert"
        hint: "a sweet dish eaten after a meal"
      - term: "personal"
        hint: "belonging to or about one person"
      - term: "personnel"
        hint: "the people who work for an organisation"

  - name: "Unit 5"
    words:
      - term: "fun"
        hint: "enjoyment; pleasant"
      - term: "funny"
        hint: "making you laugh"
      - term: "bored"
        hint: "feeling tired because nothing interests you"
      - term: "boring"
        hint: "not interesting"
      - term: "interested"
        hint: "wanting to know more about something"
      - term: "interesting"
        hint: "making you want to know more"
      - term: "actually"
        hint: "in fact, really"
      - term: "currently"
        hint: "at the present time"
      - term: "especially"
        hint: "more than usual; particularly"
      - term: "specially"
        hint: "for one particular purpose"

  - name: "Unit 6"
    words:
      - term: "remember"
        hint: "to keep something in your memory"
      - term: "remind"
        hint: "to make someone remember something"
      - term: "hear"
        hint: "to notice sounds with your ears"
      - term: "listen"
        hint: "to pay attention to sounds"
      - term: "see"
        hint: "to notice with your eyes"
      - term: "watch"
        hint: "to look at something for a time, like TV"
      - term: "win"
        hint: "to be first in a game or competition"
      - term: "earn"
        hint: "to get money for work"
      - term: "job"
        hint: "a particular paid position (countable)"
      - term: "work"
        hint: "activity you do to earn money (uncountable)"

  - name: "Unit 7"
    words:
      - term: "fewer"
        hint: "a smaller number of (countable)"
      - term: "less"
        hint: "a smaller amount of (uncountable)"
      - term: "among"
        hint: "in the middle of a group of three or more"
      - term: "between"
        hint: "in the space separating two things"
      - term: "beside"
        hint: "next to"
      - term: "besides"
        hint: "in addition to"
      - term: "during"
        hint: "throughout a period of time; used with a noun"
      - term: "while"
        hint: "at the same time as; used with a clause"
      - term: "little"
        hint: "not much (uncountable)"
      - term: "few"
        hint: "not many (countable)"

  - name: "Unit 8"
    words:
      - term: "assure"
        hint: "to tell someone confidently that something is true"
      - term: "ensure"
        hint: "to make certain that something happens"
      - term: "imply"
        hint: "to suggest something without saying it"
      - term: "infer"
        hint: "to reach an opinion from evidence"
      - term: "continual"
        hint: "happening again and again"
      - term: "continuous"
        hint: "happening without stopping"
      - term: "eventually"
        hint: "in the end, after a long time"
      - term: "finally"
        hint: "after a long wait, or as the last point"
      - term: "council"
        hint: "a group of people elected to govern"
      - term: "counsel"
        hint: "advice, or to give advice"

  - name: "Unit 9"
    words:
      - term: "farther"
        hint: "at a greater physical distance"
      - term: "further"
        hint: "more; additional, or to a greater degree"
      - term: "adapt"
        hint: "to change to suit a new situation"
      - term: "adopt"
        hint: "to take a child into your family, or to start using an idea"
      - term: "emigrate"
        hint: "to leave your country to live elsewhere"
      - term: "immigrate"
        hint: "to come into a country to live there"
      - term: "convince"
        hint: "to make someone believe something is true"
      - term: "persuade"
        hint: "to make someone agree to do something"
      - term: "discover"
        hint: "to find something that existed already"
      - term: "invent"
        hint: "to create something new that did not exist"

  - name: "Unit 10"
    words:
      - term: "alternate"
        hint: "every other one; taking turns"
      - term: "alternative"
        hint: "another possible choice"
      - term: "comprehensive"
        hint: "including everything"
      - term: "comprehensible"
        hint: "able to be understood"
      - term: "considerate"
        hint: "thinking about other people's feelings"
      - term: "considerable"
        hint: "large in size or amount"
      - term: "illusion"
        hint: "something that looks real but is not"
      - term: "allusion"
        hint: "an indirect reference to something"
      - term: "precede"
        hint: "to come before"
      - term: "proceed"
        hint: "to continue or go forward"
