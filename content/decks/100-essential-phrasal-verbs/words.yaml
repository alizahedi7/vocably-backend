# The ordered phrasal-verb list. Order is the product: this is the sequence the
# deck teaches, and nothing in the pipeline may reorder it. Units are grouped
# by particle, so a learner meets ten "up" verbs together and the pattern
# sticks along with the meanings.
#
# Every entry carries a `hint`, and that is the point of this deck: "take off",
# "pick up" and "go on" each have several meanings, and the hint names the one
# being taught. The hints are Vocably's own wording — there is deliberately
# nowhere in this format to put a definition or an example.

units:
  - name: Up (1)
    words:
      - term: "give up"
        hint: "to stop trying to do something because it is too hard"
      - term: "wake up"
        hint: "to stop sleeping"
      - term: "get up"
        hint: "to leave your bed in the morning"
      - term: "pick up"
        hint: "to collect someone or something, often in a car"
      - term: "set up"
        hint: "to start a company, system or arrangement"
      - term: "make up"
        hint: "to invent a story or excuse that is not true"
      - term: "turn up"
        hint: "to arrive, especially when not expected or late"
      - term: "bring up"
        hint: "to start talking about a subject"
      - term: "end up"
        hint: "to finally be in a place or situation you did not plan"
      - term: "catch up"
        hint: "to reach the same level as others after falling behind"

  - name: Up (2)
    words:
      - term: "look up"
        hint: "to search for a word or fact in a book or online"
      - term: "show up"
        hint: "to arrive at a place where people are waiting for you"
      - term: "grow up"
        hint: "to change from a child into an adult"
      - term: "hang up"
        hint: "to end a phone call"
      - term: "speed up"
        hint: "to go or happen faster"
      - term: "cheer up"
        hint: "to become happier after being sad"
      - term: "put up with"
        hint: "to accept something unpleasant without complaining"
      - term: "come up with"
        hint: "to think of an idea or a plan"
      - term: "keep up with"
        hint: "to move or learn as fast as someone else"
      - term: "back up"
        hint: "to make a copy of computer files in case the originals are lost"

  - name: Down
    words:
      - term: "break down"
        hint: "to stop working, said of a car or machine"
      - term: "calm down"
        hint: "to become less angry or excited"
      - term: "turn down"
        hint: "to refuse an offer or request"
      - term: "let down"
        hint: "to disappoint someone by not doing what they expected"
      - term: "slow down"
        hint: "to go or happen more slowly"
      - term: "write down"
        hint: "to put words on paper so you do not forget them"
      - term: "cut down on"
        hint: "to do or use less of something, like sugar or spending"
      - term: "settle down"
        hint: "to start living a quiet, stable life in one place"
      - term: "shut down"
        hint: "to close a business or switch off a computer completely"
      - term: "look down on"
        hint: "to think you are better than someone"

  - name: "On"
    words:
      - term: "go on"
        hint: "to continue doing something"
      - term: "put on"
        hint: "to dress yourself in a piece of clothing"
      - term: "turn on"
        hint: "to make a light or machine start working"
      - term: "carry on"
        hint: "to keep doing something despite a difficulty"
      - term: "hold on"
        hint: "to wait for a short time"
      - term: "get on"
        hint: "to step onto a bus, train or plane"
      - term: "try on"
        hint: "to put on clothes to see if they fit"
      - term: "count on"
        hint: "to trust someone to do what you need"
      - term: "move on"
        hint: "to leave a situation behind and start something new"
      - term: "take on"
        hint: "to accept a new job or responsibility"

  - name: "Off"
    words:
      - term: "take off"
        hint: "to leave the ground, said of a plane"
      - term: "turn off"
        hint: "to make a light or machine stop working"
      - term: "put off"
        hint: "to delay something until a later time"
      - term: "show off"
        hint: "to try to make people admire you"
      - term: "call off"
        hint: "to cancel a planned event"
      - term: "set off"
        hint: "to start a journey"
      - term: "drop off"
        hint: "to take someone to a place and leave them there"
      - term: "tell off"
        hint: "to speak angrily to someone who has done wrong"
      - term: "get off"
        hint: "to step down from a bus, train or plane"
      - term: "log off"
        hint: "to end a session on a computer or website"

  - name: Out (1)
    words:
      - term: "find out"
        hint: "to discover a fact or piece of information"
      - term: "figure out"
        hint: "to understand or solve something after thinking about it"
      - term: "work out"
        hint: "to do physical exercise to stay fit"
      - term: "run out of"
        hint: "to have none of something left"
      - term: "hang out"
        hint: "to spend relaxed time with friends"
      - term: "go out"
        hint: "to leave home to do something enjoyable"
      - term: "eat out"
        hint: "to have a meal in a restaurant instead of at home"
      - term: "sort out"
        hint: "to deal with a problem until it is solved"
      - term: "check out"
        hint: "to look at something because it seems interesting"
      - term: "point out"
        hint: "to tell someone about a fact they had not noticed"

  - name: Out (2)
    words:
      - term: "turn out"
        hint: "to happen in a particular way in the end"
      - term: "carry out"
        hint: "to do a task or plan as intended"
      - term: "give out"
        hint: "to hand things to each person in a group"
      - term: "leave out"
        hint: "to not include someone or something"
      - term: "pass out"
        hint: "to suddenly become unconscious"
      - term: "break out"
        hint: "to start suddenly, said of a fire, war or disease"
      - term: "stand out"
        hint: "to be easy to notice because of being different"
      - term: "miss out on"
        hint: "to lose the chance to enjoy something"
      - term: "look out"
        hint: "to be careful because of danger"
      - term: "fill out"
        hint: "to write information in the spaces on a form"

  - name: In and into
    words:
      - term: "give in"
        hint: "to stop arguing and agree to what someone wants"
      - term: "fill in"
        hint: "to write information in the spaces on a form"
      - term: "join in"
        hint: "to take part in an activity with others"
      - term: "drop in"
        hint: "to visit someone without arranging it first"
      - term: "take in"
        hint: "to understand and remember what you hear or read"
      - term: "run into"
        hint: "to meet someone by chance"
      - term: "look into"
        hint: "to examine a problem to find out the facts"
      - term: "get into"
        hint: "to become interested in an activity"
      - term: "break in"
        hint: "to enter a building by force in order to steal"
      - term: "check in"
        hint: "to show your ticket and hand over your bags before a flight"

  - name: Over, back and away
    words:
      - term: "get over"
        hint: "to recover from an illness or a sad experience"
      - term: "take over"
        hint: "to take control of a company or job from someone else"
      - term: "go over"
        hint: "to examine or check something carefully"
      - term: "think over"
        hint: "to consider an idea carefully before deciding"
      - term: "come back"
        hint: "to return to a place"
      - term: "get back"
        hint: "to arrive home again after being away"
      - term: "pay back"
        hint: "to return money you borrowed"
      - term: "run away"
        hint: "to leave a place secretly to escape"
      - term: "throw away"
        hint: "to get rid of something you no longer want"
      - term: "give away"
        hint: "to give something to someone without asking for money"

  - name: Through, after, for and around
    words:
      - term: "go through"
        hint: "to experience a difficult or unpleasant time"
      - term: "get through"
        hint: "to reach someone on the phone"
      - term: "look after"
        hint: "to take care of a person, animal or thing"
      - term: "take after"
        hint: "to look or behave like an older relative"
      - term: "look for"
        hint: "to try to find someone or something"
      - term: "look forward to"
        hint: "to feel happy about something that is going to happen"
      - term: "stand for"
        hint: "to be a short form of, said of letters or symbols"
      - term: "apply for"
        hint: "to ask officially for a job, visa or place"
      - term: "get along with"
        hint: "to have a friendly relationship with someone"
      - term: "show around"
        hint: "to take a visitor through a place and point out what is there"
