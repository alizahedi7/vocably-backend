# The ordered word list. Order is the product: nothing in the pipeline may
# reorder it. Compiled by Vocably; nothing here is copied from any source.
#
# Every entry carries a hint: a collocation is taught as a whole, and the hint
# names the sense meant where the phrase has more than one.
#
# There is deliberately nowhere to put a definition or an example. Those are
# generated; copying them from a source is the one thing this format forbids.

units:
  - name: "Make"
    words:
      - term: "make a decision"
        hint: "to decide something after thinking"
      - term: "make a mistake"
        hint: "to do something wrong by accident"
      - term: "make money"
        hint: "to earn money"
      - term: "make progress"
        hint: "to improve or move forward"
      - term: "make an effort"
        hint: "to try hard"
      - term: "make sense"
