      - term: "make friends"
        hint: "to start a friendship with people"
      - term: "make a promise"
        hint: "to say you will certainly do something"
      - term: "make a complaint"
        hint: "to tell someone formally that you are unhappy"
      - term: "make a difference"
        hint: "to have an important effect"

  - name: "Do"
