# The ordered headword list. Order is the product: the sublists run from the
# most frequent academic word families to the least, so Sublist 1 is the one
# to learn first, and nothing in the pipeline may reorder it. Within a sublist
# the headwords are alphabetical, as the source publishes them.
#
# Headwords are given in American spelling (analyze, labor, license, minimize),
# which is what the other decks here teach; the list itself is published in
# British spelling. Nothing else is changed.
#
# A bare string is a word with no sense preference - the ordinary case.
# A mapping may add:
#   sense: {pos: verb, context: Research}     # an exact pin; needs BOTH keys
#   hint: "to start an organization"          # free text, scored against senses
#
# There is deliberately nowhere to put a definition or an example. Those are
# generated; copying them from a source is the one thing this format forbids.

