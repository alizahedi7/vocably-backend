slug: academic-word-list
version: "1.0.0"
name: Academic Word List
name_fa: فهرست واژگان آکادمیک
category: academic
# One line, and it must stay one line: the Explore card is a fixed height, so
# a longer description is silently truncated rather than given more room.
description: The 570 word families behind every university text.
description_fa: ۵۷۰ خانواده واژه‌ای که پشت هر متن دانشگاهی است.
official: true
# Green, so the card is told apart from the business deck's teal and the
# travel deck's blue at a glance.
hue: 150
# Drawn in place of the deck's initial by clients that ship the asset. A client
# with no asset for this slug draws the initial instead, which is not an error.
icon: awl

source:
  title: The Academic Word List
  authors: [Coxhead]
  url: https://www.wgtn.ac.nz/lals/resources/academicwordlist
  rights: >-
    Headword list and sublist grouping only, used as the study order. The list
    is published by its author for free use in teaching and is reproduced here
    with American spellings of the headwords. No definition, example sentence
    or explanatory text from any source is reproduced here or on any card: the
    hints in words.yaml are Vocably's own wording, written to pick the academic
    sense where a dictionary's first sense is a different one, and every word
    of card content is generated by Vocably's own pipeline or taken from a free
    dictionary.

structure:
  # Asserted, not derived: a word list that silently loses an entry is otherwise
  # invisible until a learner notices a sublist is short.
  #
  # `words_per_unit` is deliberately absent — sublists 1-9 hold 60 and sublist
  # 10 holds 30, and the loader fails a template whose declared per-unit count
  # disagrees with any unit. `expected_words` still catches a dropped entry.
  expected_units: 10
  expected_words: 570

generation:
  native_language: Persian
  register: adult
  # The full ladder. Most headwords need no pin — the academic sense is the
  # common one — so the `academic` prior and `first` carry the bulk of the deck,
  # and those picks are exactly what the admin review queue surfaces. The hints
  # cover the headwords whose commonest sense is not the academic one ("found",
  # "sole", "prime", "stable").
  sense_selection: [explicit, hint, category, first]
  enrichment: allowed
  max_senses: 4

publication:
  # Never automatic. A build finishing is not a reason for five hundred
  # unreviewed cards to appear in Explore.
  review_required: true
  publish: manual
