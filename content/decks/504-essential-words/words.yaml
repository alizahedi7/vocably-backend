# The ordered headword list. Order is the product: this is the sequence the
# course teaches, and nothing in the pipeline may reorder it.
#
# Extracted from the source book's own index (word -> lesson) for the grouping,
# and from its numbered "Words to Learn This Week" entries for the order within
# each lesson. 479 of 504 headwords were placed by their printed position; the
# remaining 25 are ones whose headword the OCR destroyed, and they sit in the
# free slots of their own lesson. Lessons 1-3 and 32 were verified by hand
# against the book and match exactly.
#
# A bare string is a word with no sense preference - the ordinary case.
# A mapping may add:
#   sense: {pos: verb, context: Management}   # an exact pin; needs BOTH keys
#   hint: "to give up completely"             # free text, scored against senses
#
# There is deliberately nowhere to put a definition or an example. Those are
# generated; copying them from the source is the one thing this format forbids.

