slug: 504-essential-words
version: "1.0.0"
name: Essential 504 — Vocabulary Course
name_fa: ۵۰۴ واژه ضروری
category: exam
description: >-
  The classic 504-word vocabulary course, one lesson at a time. Twelve words a
  lesson, in the order the course teaches them.
description_fa: >-
  دوره کلاسیک ۵۰۴ واژه ضروری، درس به درس. هر درس دوازده واژه، به همان ترتیبی که
  کتاب آموزش می‌دهد.
official: true
hue: 262

source:
  title: 504 Absolutely Essential Words
  authors: [Bromberg, Liebb, Traiger]
  edition: 6th
  isbn: "978-1438074450"
  rights: >-
    Headword list and lesson boundaries only, used as an index of study order.
    No definitions, example sentences, exercises or explanatory text from the
    source are reproduced anywhere in this repository or on any card. Every word
    of card content is generated by Vocably's own pipeline or taken from a free
    dictionary. The deck is named descriptively rather than after the book.

structure:
  # Asserted, not derived: a word list that silently loses an entry is otherwise
  # invisible until a learner notices a lesson has eleven words.
  #
  words_per_unit: 12
  expected_units: 42
  expected_words: 504

generation:
  native_language: Persian
  register: adult
  # The full ladder. Most words here need no pin at all — a course teaches the
  # common sense of a word — so `first` carries the bulk of the deck, and those
  # picks are exactly what the admin review queue surfaces.
  sense_selection: [explicit, hint, category, first]
  enrichment: allowed
  max_senses: 4

publication:
  # Never automatic. A build finishing is not a reason for five hundred
  # unreviewed cards to appear in Explore.
  review_required: true
  publish: manual
