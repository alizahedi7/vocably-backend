# The ordered word list. Order is the product: this is the sequence the deck
# teaches, and nothing in the pipeline may reorder it. Each unit is one essay
# topic, so the deck can be studied a topic at a time.
#
# Compiled by Vocably; nothing here is copied from any coursebook or word list.
#
# A bare string is a word with no sense preference - the ordinary case.
# A mapping may add:
#   sense: {pos: noun, context: Law}            # an exact pin; needs BOTH keys
#   hint: "the punishment a court gives"       # free text, scored against senses
#
# There is deliberately nowhere to put a definition or an example. Those are
# generated; copying them from a source is the one thing this format forbids.

