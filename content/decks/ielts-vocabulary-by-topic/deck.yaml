slug: ielts-vocabulary-by-topic
version: "1.0.0"
name: IELTS Vocabulary by Topic
name_fa: واژگان آیلتس به تفکیک موضوع
# `exams`, not `exam`: the client's Explore chip sends `exams`, and the filter
# is an exact match.
category: exams
# One line, and it must stay one line: the Explore card is a fixed height, so
# a longer description is silently truncated rather than given more room.
description: Ten essay topics, twenty words each, for Writing and Speaking.
description_fa: ده موضوع رایج، هر کدام بیست واژه، برای رایتینگ و اسپیکینگ.
official: true
# Coral, so the card is told apart from the 1100 deck's amber and the idioms
# deck's magenta at a glance.
hue: 8
# Drawn in place of the deck's initial by clients that ship the asset. A client
# with no asset for this slug draws the initial instead, which is not an error.
icon: ielts

# No source: the list was compiled by Vocably around the topics IELTS Writing
# Task 2 and Speaking Part 3 return to most often. Each unit is one topic, so a
# learner preparing for a particular essay can study that unit alone.

structure:
  # Asserted, not derived: a word list that silently loses an entry is otherwise
  # invisible until a learner notices a topic is short.
  words_per_unit: 20
  expected_units: 10
  expected_words: 200

generation:
  native_language: Persian
  register: adult
  # No `category`: there is no prior for `exams`, so that rung could never fire
  # and would only add a strategy to read past. Hints cover the words whose
  # commonest sense is not the essay sense ("sentence", "fine", "press").
  sense_selection: [explicit, hint, first]
  enrichment: allowed
  max_senses: 4

publication:
  # Never automatic. A build finishing is not a reason for two hundred
  # unreviewed cards to appear in Explore.
  review_required: true
  publish: manual
