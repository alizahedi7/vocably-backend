slug: 50-useful-english-idioms
version: "1.0.0"
name: 50 Useful English Idioms
name_fa: ۵۰ اصطلاح کاربردی انگلیسی
category: general
# One line, and it must stay one line: the Explore card is a fixed height, so
# a longer description is silently truncated rather than given more room.
description: Everyday phrases whose meaning is not in the words.
description_fa: عبارت‌های روزمره‌ای که معنایشان در واژه‌ها نیست.
official: true
# Magenta, so the card is told apart from the 504 deck's violet, the 1100
# deck's amber and the business deck's teal at a glance.
hue: 330
# Drawn in place of the deck's initial by clients that ship the asset. Without
# it every card here would render as a coloured "5", which is what the 504 deck
# already reduces to. A client with no asset for this slug draws the initial
# instead, which is not an error.
icon: idioms

source:
  title: 30 Useful English Idiomatic Expressions & Their Meanings
  url: https://www.oxfordinternationalenglish.com/30-useful-english-idiomatic-expressions-their-meanings/
  rights: >-
    Headword list and its order only, used as an index of study order. The
    idioms themselves are common-property English phrases, not the source's
    invention. No definition, gloss, example sentence or explanatory text from
    the page is reproduced here or on any card: the hints in words.yaml are
    Vocably's own wording, written to disambiguate the figurative sense from the
    literal one, and every word of card content is generated by Vocably's own
    pipeline or taken from a free dictionary.

structure:
  # Asserted, not derived: a word list that silently loses an entry is otherwise
  # invisible until a learner notices a set has nine cards.
  words_per_unit: 10
  expected_units: 5
  expected_words: 50

generation:
  native_language: Persian
  register: adult
  # No `category`: the `general` prior is empty, so that rung could never fire
  # and would only add a strategy to read past. `explicit` stays for a future
  # pin even though nothing here carries one — an idiom's sense is not usefully
  # described as pos + context.
  #
  # `hint` is the load-bearing rung for this deck. A dictionary's first sense of
  # "break the ice" or "on the ball" is the literal one, and the literal one is
  # exactly what this deck is not teaching.
  sense_selection: [explicit, hint, first]
  # On, and it will fire often: the figurative sense of a phrase is frequently
  # missing from the lexicon entirely, which is the case enrichment exists for.
  enrichment: allowed
  max_senses: 4

publication:
  # Never automatic. A build finishing is not a reason for fifty unreviewed
  # cards to appear in Explore.
  review_required: true
  publish: manual
