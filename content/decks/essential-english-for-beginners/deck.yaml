slug: essential-english-for-beginners
version: "1.0.0"
name: Essential English for Beginners
name_fa: "انگلیسی پایه برای مبتدی‌ها"
category: general
# One line, and it must stay one line: the Explore card is a fixed height, so
# a longer description is silently truncated rather than given more room.
description: "The first two hundred words every learner needs."
description_fa: "دویست واژه‌ی نخستی که هر زبان‌آموزی لازم دارد."
official: true
# Green, thirty degrees from the AWL deck so the two are told apart at a glance.
hue: 120
# Drawn in place of the deck's initial by clients that ship the asset. A client
# with no asset for this slug draws the initial instead, which is not an error.
icon: abc

# No source. Compiled by Vocably. Ten everyday topics, from people and home to the small words that hold a sentence together, in the order a beginner meets them.

structure:
  # Asserted, not derived: a word list that silently loses an entry is otherwise
  # invisible until a learner notices a unit is short.
  words_per_unit: 20
  expected_units: 10
  expected_words: 200

generation:
  native_language: Persian
  register: adult
  # No category prior applies here, so the ladder is pins, hints, then the
  # commonest sense.
  sense_selection: [explicit, hint, first]
  enrichment: allowed
  max_senses: 4

publication:
  # Never automatic. A build finishing is not a reason for unreviewed cards to
  # appear in Explore.
  review_required: true
  publish: manual
