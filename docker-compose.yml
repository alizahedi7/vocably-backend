services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vocably}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vocably}
      POSTGRES_DB: ${POSTGRES_DB:-vocably}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vocably} -d ${POSTGRES_DB:-vocably}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # Durability is not needed: the broker holds in-flight task messages, and a
    # lost scheduled run is re-emitted by beat on the next tick. Keeping the
    # default RDB snapshots would only add disk churn.
    command: redis-server --save "" --appendonly no
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    # Load the local .env into the container's process environment so app
    # settings (GOOGLE_VERIFIER, GOOGLE_CLIENT_ID, OTP_SENDER, …) are actually
    # applied. Compose otherwise only uses .env for ${VAR} substitution in this
    # file — it does NOT pass those values into the container. Without this the
    # app falls back to defaults (e.g. GOOGLE_VERIFIER=stub), which treats the
    # entire Google id_token as the user identity.
    # Optional: .env is gitignored, so a fresh clone brings up defaults instead
    # of failing. Copy .env.example to .env to override them.
    env_file:
      - path: .env
        required: false
    environment:
      # Inside the compose network the DB host is the service name "db".
      # These win over .env because the DB host differs inside the network.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vocably}:${POSTGRES_PASSWORD:-vocably}@db:5432/${POSTGRES_DB:-vocably}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    ports:
      - "8000:8000"
    # Apply migrations then start the API.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  # Executes background tasks. Safe to scale: `docker compose up --scale worker=4`.
  worker:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vocably}:${POSTGRES_PASSWORD:-vocably}@db:5432/${POSTGRES_DB:-vocably}
      CELERY_BROKER_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    command: celery -A app.tasks worker --loglevel=info -Q default,maintenance,ai

  # Emits scheduled tasks. MUST stay at exactly one replica — beat is a clock,
  # and a second one makes every scheduled task fire twice.
  beat:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vocably}:${POSTGRES_PASSWORD:-vocably}@db:5432/${POSTGRES_DB:-vocably}
      CELERY_BROKER_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    # The schedule file records when each entry last fired. In /tmp because the
    # image's working directory is read-only to the non-root user.
    command: celery -A app.tasks beat --loglevel=info --schedule=/tmp/celerybeat-schedule

volumes:
  pgdata:
