name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Lint, typecheck, tests (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run ruff check app tests
      - run: uv run ruff format --check app tests
      - run: uv run mypy app
      - run: uv run pytest -q --cov=app --cov-report=term-missing

  postgres:
    name: Migrations + tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vocably
          POSTGRES_PASSWORD: vocably
          POSTGRES_DB: vocably
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vocably"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://vocably:vocably@localhost:5432/vocably
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev

      # The full migration chain must apply, roll back, and re-apply cleanly.
      - name: Migration round-trip
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Test suite against Postgres
        run: uv run pytest -q
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://vocably:vocably@localhost:5432/vocably

  deploy:
    name: Build image + deploy to VPS
    # Only after both check jobs pass, and only for commits landing on main —
    # PR runs stop at the checks above.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, postgres]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/alizahedi7/vocably-backend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image is pushed by the time we get here, so everything below is
      # about reaching the box. That link drops inbound connections from
      # GitHub's runners often enough to lose a deploy to a single
      # `dial tcp: i/o timeout` on a host that is otherwise healthy — which is
      # why this is plain ssh/scp in a retry loop rather than the appleboy
      # actions it replaced: those dial once, with a 30s timeout, and offer no
      # way to try again. Every hop here is idempotent, so a retry that lands
      # after a half-finished attempt costs nothing.
      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          # GITHUB_TOKEN is valid for the duration of this job — long enough to pull.
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_deploy
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy

          # Host keys are not pinned, exactly as the actions this replaced did
          # not pin them: the private key is the credential. ConnectTimeout is
          # four times the old 30s because the dial that *succeeded* in the
          # deploy this replaced took very nearly the whole 30s.
          SSH_OPTS="-i $HOME/.ssh/id_deploy
                    -o StrictHostKeyChecking=no
                    -o UserKnownHostsFile=/dev/null
                    -o LogLevel=ERROR
                    -o ConnectTimeout=120
                    -o ServerAliveInterval=15
                    -o ServerAliveCountMax=20"

          retry() {
            local attempt=1
            until "$@"; do
              if [ "$attempt" -ge 3 ]; then
                echo "::error::deploy step failed after $attempt attempts"
                return 1
              fi
              echo "attempt $attempt failed; retrying in $((attempt * 20))s"
              sleep $((attempt * 20))
              attempt=$((attempt + 1))
            done
          }

          # The remote half is written to a file, then piped in, rather than
          # passed as an argument: that keeps the registry token off the VPS's
          # process list, and lets each retry re-read it from the top. The
          # credentials are prepended as %q-quoted assignments and the body is
          # a quoted heredoc, so nothing in a token is ever re-expanded by
          # either shell.
          {
            printf 'GHCR_USER=%q\n' "$GHCR_USER"
            printf 'GHCR_TOKEN=%q\n' "$GHCR_TOKEN"
            cat <<'REMOTE'
          set -e
          cd /opt/vocably
          printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d
          docker logout ghcr.io
          docker image prune -f
          docker compose -f docker-compose.prod.yml ps
          REMOTE
          } > "$RUNNER_TEMP/restart-stack.sh"

          make_target()  { ssh $SSH_OPTS -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" mkdir -p /opt/vocably; }
          copy_config()  { scp $SSH_OPTS -P "$VPS_PORT" deploy/docker-compose.prod.yml deploy/Caddyfile "$VPS_USER@$VPS_HOST:/opt/vocably/"; }
          restart_stack() { ssh $SSH_OPTS -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" bash -s < "$RUNNER_TEMP/restart-stack.sh"; }

          retry make_target
          retry copy_config
          retry restart_stack
